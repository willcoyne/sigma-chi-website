name: Deploy to GitHub Pages

# Builds the Vite app and publishes the dist/ folder to GitHub Pages
# whenever changes land on main. See DEPLOYMENT.md for one-time setup
# steps (enabling Pages, choosing "GitHub Actions" as the source, etc.).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # These are repository *variables*, not secrets: Vite inlines every
          # VITE_* value into the public client bundle, so there is nothing to
          # keep hidden. Set them under
          # Settings > Secrets and variables > Actions > Variables.
          #
          # While VITE_FORMSPREE_ENDPOINT is unset the contact form runs in
          # local-only demo mode and discards submissions without sending them
          # anywhere. See the comment in src/components/ContactForm.tsx.
          VITE_FORMSPREE_ENDPOINT: ${{ vars.VITE_FORMSPREE_ENDPOINT }}
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
          VITE_INSTAGRAM_EMBED_URL: ${{ vars.VITE_INSTAGRAM_EMBED_URL }}

      # The SPA fallback (dist/404.html) and the per-route index.html files
      # that make deep links answer 200 instead of 404 are both emitted by
      # scripts/prerender-routes.mjs, which `npm run build` runs.

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
